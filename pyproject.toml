[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "connaissance"
version = "2.47.0"
description = "Personal knowledge base CLI — transcription, summarization, entity organization, synthesis, audit. Built around a local Markdown + SQLite store."
requires-python = ">=3.10"
authors = [{ name = "guioum" }]
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
connaissance = "connaissance.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
# Extra `pdf` : couche texte des PDF born-digital pour `documents signals`
# (Phase B). Optionnel et utilisé en dernier recours — absent, les signaux
# dégradent proprement vers nom/chemin/métadonnées/cache OCR. pypdfium2 est une
# lib Python pure (PDFium lié, in-process) : s'installe à l'identique Mac/VM via
# uv, déterministe, pas de binaire système (cf. décision vs poppler/czkawka).
pdf = ["pypdfium2>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"connaissance" = ["prompts/*.md", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
