name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with test extra)
        run: pip install -e ".[test]"
      # Certains tests (test_secrets*) exigent que la racine ~/Connaissance
      # existe (require_connaissance_root) ; le CLI ne la crée jamais lui-même.
      - name: Create knowledge-base root expected by the suite
        run: mkdir -p ~/Connaissance
      - name: Run test suite
        run: python -m pytest tests/ -q
