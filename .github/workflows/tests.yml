name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (with test extra)
        run: pip install -e ".[test]"
      # Certains tests (test_secrets*) exigent que la racine ~/Connaissance
      # existe (require_connaissance_root) ; le CLI ne la crée jamais lui-même.
      - name: Create knowledge-base root expected by the suite
        run: mkdir -p ~/Connaissance
      - name: Run test suite
        run: python -m pytest tests/ -q

  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyrightconfig.json résout l'environnement via venvPath/venv=.venv :
      # on installe le package dans un venv local du même nom qu'en dev.
      - name: Install package in .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      - name: Run pyright (contrat schemas ↔ commandes)
        run: |
          pip install pyright
          pyright
